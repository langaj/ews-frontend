<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>管理员部署 Wiki - EWS</title>
<link rel="stylesheet" href="/css/style.css">
<style>
body{background:var(--gray-50);color:var(--gray-900)}.wiki-page{max-width:1320px;padding-bottom:64px}.wiki-header{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;margin:34px 0 22px}.wiki-header h1{margin:0;color:#1d2939;font-size:27px;line-height:1.25}.wiki-header p{max-width:680px;margin:8px 0 0;color:var(--gray-500);font-size:13px;line-height:1.65}.wiki-badge{display:inline-flex;align-items:center;min-height:28px;padding:4px 9px;border:1px solid #b2ddff;border-radius:6px;background:#eff8ff;color:#175cd3;font-size:11px;font-weight:700;white-space:nowrap}.wiki-loading{display:grid;gap:12px;padding:26px 0}.wiki-skeleton{height:18px;border-radius:4px;background:linear-gradient(90deg,#eef2f6 25%,#f8fafc 37%,#eef2f6 63%);background-size:400% 100%;animation:wiki-loading 1.4s ease infinite}.wiki-skeleton:nth-child(2){width:76%}.wiki-skeleton:nth-child(3){width:54%}@keyframes wiki-loading{0%{background-position:100% 0}100%{background-position:0 0}}.wiki-error{max-width:650px;padding:18px;border-left:3px solid #d92d20;background:#fef3f2;color:#7a271a;font-size:13px;line-height:1.65}.wiki-workbench{display:grid;grid-template-columns:minmax(190px,1fr) 150px 120px auto;gap:10px;align-items:end;padding:16px 0;border-top:1px solid var(--gray-200);border-bottom:1px solid var(--gray-200)}.wiki-input label{display:block;margin-bottom:5px;color:var(--gray-600);font-size:11px;font-weight:700}.wiki-input .form-input{width:100%}.wiki-download{align-self:end;min-height:38px;white-space:nowrap}.wiki-validation{grid-column:1/-1;min-height:18px;margin-top:8px;color:#b42318;font-size:11px}.wiki-layout{display:grid;grid-template-columns:198px minmax(0,1fr);gap:34px;margin-top:26px}.wiki-nav{position:sticky;top:76px;align-self:start;border-right:1px solid var(--gray-200);padding:3px 18px 8px 0}.wiki-nav-title{display:block;margin-bottom:8px;color:var(--gray-500);font-size:10px;font-weight:700}.wiki-nav a{display:block;padding:7px 0;color:#667085;font-size:12px;line-height:1.35;text-decoration:none}.wiki-nav a:hover{color:#344054}.wiki-nav b{display:inline-block;width:28px;color:#98a2b3;font-size:10px}.wiki-main{min-width:0}.wiki-overview{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--gray-200)}.wiki-stat{min-height:80px;padding:14px 16px;border-right:1px solid var(--gray-200)}.wiki-stat:first-child{padding-left:0}.wiki-stat:last-child{border-right:0}.wiki-stat span{display:block;color:#667085;font-size:10px}.wiki-stat strong{display:block;margin-top:6px;color:#344054;font-size:13px;overflow-wrap:anywhere}.wiki-section{scroll-margin-top:82px;padding:30px 0;border-bottom:1px solid var(--gray-200)}.wiki-section-head{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;margin-bottom:20px}.wiki-section-no{padding-top:2px;color:#98a2b3;font-size:11px;font-weight:700}.wiki-section h2{margin:0;color:#1d2939;font-size:18px;line-height:1.35}.wiki-section-intro{margin:7px 0 0;color:#667085;font-size:13px;line-height:1.7}.wiki-step{padding:18px 0;border-top:1px solid #eaecf0}.wiki-step:first-of-type{border-top:0;padding-top:0}.wiki-step h3{margin:0;color:#344054;font-size:14px}.wiki-step p{max-width:820px;margin:7px 0 0;color:#667085;font-size:12px;line-height:1.7}.wiki-bullets{display:grid;gap:5px;max-width:840px;margin:12px 0 0;padding:0;list-style:none}.wiki-bullets li{position:relative;padding-left:14px;color:#475467;font-size:12px;line-height:1.55}.wiki-bullets li::before{position:absolute;left:0;top:8px;width:4px;height:4px;border-radius:50%;background:#98a2b3;content:''}.command-list{display:grid;gap:10px;margin-top:14px}.command-block{border:1px solid #d0d5dd;border-radius:7px;background:#fff;overflow:hidden}.command-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:36px;padding:0 10px;border-bottom:1px solid #eaecf0;background:#f9fafb}.command-head span{color:#475467;font-size:11px;font-weight:700}.command-head code{color:#98a2b3;font-size:10px}.command-copy,.webhook-copy{min-height:28px;padding:4px 8px;border:1px solid #d0d5dd;border-radius:5px;background:#fff;color:#344054;font-size:11px;cursor:pointer}.command-copy:hover,.webhook-copy:hover{border-color:#98a2b3;background:#f9fafb}.command-code{display:block;max-height:310px;overflow:auto;margin:0;padding:12px;background:#101828;color:#e4e7ec;font:11px/1.65 Consolas,"SFMono-Regular",monospace;white-space:pre-wrap;overflow-wrap:anywhere}.wiki-webhook-table{width:100%;margin-top:14px;border-collapse:collapse;font-size:12px}.wiki-webhook-table th,.wiki-webhook-table td{padding:10px 8px;border-bottom:1px solid #eaecf0;text-align:left;vertical-align:top}.wiki-webhook-table th{color:#667085;font-size:10px}.wiki-webhook-table code{color:#344054;font-size:11px;overflow-wrap:anywhere}.wiki-webhook-table td:last-child{text-align:right}.wiki-footer-note{margin-top:16px;color:#667085;font-size:11px;line-height:1.6}.wiki-credentials{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}.credential-row{padding:11px 12px;border:1px solid #eaecf0;border-radius:7px;background:#fff}.credential-row strong{display:block;color:#344054;font-size:12px}.credential-row code{display:block;margin-top:5px;color:#667085;font-size:10px;overflow-wrap:anywhere}.credential-row span{display:block;margin-top:5px;color:#667085;font-size:11px;line-height:1.45}.wiki-toast{position:fixed;right:18px;bottom:18px;z-index:300;display:none;max-width:310px;padding:10px 12px;border-radius:6px;background:#101828;color:#fff;font-size:12px;box-shadow:0 8px 20px rgba(16,24,40,.22)}.wiki-toast.show{display:block}@media(max-width:950px){.wiki-workbench{grid-template-columns:1fr 1fr}.wiki-download{width:100%}.wiki-layout{grid-template-columns:1fr}.wiki-nav{position:static;display:flex;gap:12px;overflow:auto;border-right:0;border-bottom:1px solid var(--gray-200);padding:0 0 10px}.wiki-nav-title{display:none}.wiki-nav a{flex:0 0 auto;padding:3px 0}.wiki-overview{grid-template-columns:repeat(2,minmax(0,1fr))}.wiki-stat:nth-child(2){border-right:0}.wiki-stat:nth-child(-n+2){border-bottom:1px solid var(--gray-200)}}@media(max-width:640px){.wiki-page{padding-right:14px;padding-left:14px}.wiki-header{display:block;margin-top:24px}.wiki-badge{margin-top:12px}.wiki-workbench{grid-template-columns:1fr}.wiki-layout{margin-top:18px;gap:20px}.wiki-overview{display:block}.wiki-stat,.wiki-stat:first-child{min-height:0;padding:12px 0;border-right:0;border-bottom:1px solid var(--gray-200)}.wiki-section{padding:24px 0}.wiki-section-head{grid-template-columns:34px minmax(0,1fr)}.wiki-credentials{grid-template-columns:1fr}.wiki-webhook-table,.wiki-webhook-table tbody{display:block}.wiki-webhook-table thead,.wiki-webhook-table td:nth-child(3){display:none}.wiki-webhook-table tr{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:6px 8px;padding:11px 0;border-bottom:1px solid #eaecf0}.wiki-webhook-table td{padding:0;border:0}.wiki-webhook-table td:nth-child(4){grid-column:1/4;min-width:0}.wiki-webhook-table td:last-child{grid-column:3;grid-row:1;text-align:right}.wiki-webhook-table code{display:block;white-space:normal;overflow-wrap:anywhere}}
</style></head><body>
<script src="/js/nav.js"></script>
<div class="app-container wiki-page">
  <header class="wiki-header"><div><h1>管理员部署 Wiki</h1><p>正在验证身份并加载受保护的部署资料。</p></div><span class="wiki-badge">ADMIN ONLY</span></header>
  <main id="wikiMount" aria-live="polite"><div class="wiki-loading"><div class="wiki-skeleton"></div><div class="wiki-skeleton"></div><div class="wiki-skeleton"></div></div></main>
</div>
<div class="wiki-toast" id="wikiToast" role="status"></div>
<script src="/js/api.js?v=20260725-1"></script>
<script>
var wikiData=null,commandTemplates={},wikiState={domain:'',nodeName:'',port:''};
function escapeHtml(value){return String(value===undefined||value===null?'':value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function showWikiToast(message){var toast=document.getElementById('wikiToast');toast.textContent=message;toast.classList.add('show');clearTimeout(showWikiToast.timer);showWikiToast.timer=setTimeout(function(){toast.classList.remove('show')},2400)}
function commandId(prefix,index){return prefix+'-'+index}
function normalizeDomain(value){var raw=String(value||'').trim().replace(/^https?:\/\//i,'').replace(/\/$/,'');if(!raw||/[\s/]/.test(raw))return'';try{var parsed=new URL('https://'+raw);return parsed.hostname?parsed.host:''}catch(_){return''}}
function validNodeName(value){return/^[a-z0-9][a-z0-9-]{0,31}$/.test(String(value||''))}
function validPort(value){var port=Number(value);return Number.isInteger(port)&&port>=1024&&port<=65535}
function tokens(){var domain=normalizeDomain(wikiState.domain)||wikiState.domain.trim();return{'{{DOMAIN}}':domain,'{{NODE_NAME}}':wikiState.nodeName.trim(),'{{PORT}}':wikiState.port.trim()}}
function resolveTemplate(template){var values=tokens();return String(template||'').replace(/\{\{DOMAIN\}\}|\{\{NODE_NAME\}\}|\{\{PORT\}\}/g,function(token){return values[token]||token})}
function registerCommand(template,prefix,index){var id=commandId(prefix,index);commandTemplates[id]=template;return id}
function commandBlock(command,prefix,index){var id=registerCommand(command.template,prefix,index);return'<div class="command-block"><div class="command-head"><span>'+escapeHtml(command.label)+'</span><div><code>'+escapeHtml(command.language)+'</code> <button class="command-copy" type="button" data-copy="'+id+'">复制</button></div></div><code class="command-code" id="'+id+'"></code></div>'}
function renderStep(step,sectionIndex,stepIndex){var bullets=(step.bullets||[]).map(function(item){return'<li>'+escapeHtml(item)+'</li>'}).join('');var commands=(step.commands||[]).map(function(command,index){return commandBlock(command,'command-'+sectionIndex+'-'+stepIndex,index)}).join('');return'<article class="wiki-step"><h3>'+escapeHtml(step.title)+'</h3><p>'+escapeHtml(step.body||'')+'</p>'+(bullets?'<ul class="wiki-bullets">'+bullets+'</ul>':'')+(commands?'<div class="command-list">'+commands+'</div>':'')+'</article>'}
function renderCredentialRows(credentials){return credentials.map(function(item){return'<div class="credential-row"><strong>'+escapeHtml(item.name)+'</strong><code>'+escapeHtml(item.id)+' · '+escapeHtml(item.type)+'</code><span>'+escapeHtml(item.usage)+'</span></div>'}).join('')}
function renderWiki(wiki){wikiData=wiki;wikiState.domain=wiki.defaults.domain;wikiState.nodeName=wiki.defaults.node_name;wikiState.port=String(wiki.defaults.port);commandTemplates={};var nav=wiki.sections.map(function(section){return'<a href="#'+escapeHtml(section.id)+'"><b>'+escapeHtml(section.number)+'</b>'+escapeHtml(section.title)+'</a>'}).join('');var sections=wiki.sections.map(function(section,sectionIndex){var steps=section.steps.map(function(step,stepIndex){return renderStep(step,sectionIndex,stepIndex)}).join('');return'<section class="wiki-section" id="'+escapeHtml(section.id)+'"><div class="wiki-section-head"><span class="wiki-section-no">'+escapeHtml(section.number)+'</span><div><h2>'+escapeHtml(section.title)+'</h2><p class="wiki-section-intro">'+escapeHtml(section.intro)+'</p></div></div>'+steps+'</section>'}).join('');var webhookRows=wiki.webhooks.map(function(item,index){var id=registerCommand('https://{{DOMAIN}}'+item.path,'webhook',index);return'<tr><td>'+escapeHtml(item.platform)+'</td><td>'+escapeHtml(item.name)+'</td><td><code>'+escapeHtml(item.path)+'</code></td><td><code id="'+id+'"></code></td><td><button class="webhook-copy" type="button" data-copy="'+id+'">复制</button></td></tr>'}).join('');document.getElementById('wikiMount').innerHTML='<section class="wiki-workbench" aria-label="部署命令参数"><div class="wiki-input"><label for="wikiDomain">公开域名</label><input class="form-input" id="wikiDomain" autocomplete="url" value="'+escapeHtml(wikiState.domain)+'" placeholder="n8n-node2.example.com"></div><div class="wiki-input"><label for="wikiNodeName">节点名称</label><input class="form-input" id="wikiNodeName" value="'+escapeHtml(wikiState.nodeName)+'" maxlength="32"></div><div class="wiki-input"><label for="wikiPort">本机端口</label><input class="form-input" id="wikiPort" inputmode="numeric" value="'+escapeHtml(wikiState.port)+'"></div><button class="btn btn-primary wiki-download" id="downloadScript" type="button">下载部署脚本</button><div class="wiki-validation" id="wikiValidation" aria-live="polite"></div></section><div class="wiki-layout"><aside class="wiki-nav"><span class="wiki-nav-title">部署目录</span>'+nav+'</aside><div class="wiki-main"><div class="wiki-overview"><div class="wiki-stat"><span>n8n 版本</span><strong>'+escapeHtml(wiki.defaults.n8n_version)+'</strong></div><div class="wiki-stat"><span>默认并发</span><strong>'+escapeHtml(wiki.defaults.concurrency)+'</strong></div><div class="wiki-stat"><span>工作流</span><strong>'+wiki.webhooks.length+' 个 webhook</strong></div><div class="wiki-stat"><span>脚本校验</span><strong>'+escapeHtml(wiki.script.sha256.slice(0,16))+'...</strong></div></div><section class="wiki-section" id="credential-registry"><div class="wiki-section-head"><span class="wiki-section-no">KEY</span><div><h2>凭证登记</h2><p class="wiki-section-intro">凭证 ID 必须随工作流迁移，避免导入后节点引用失效。</p></div></div><div class="wiki-credentials">'+renderCredentialRows(wiki.credentials)+'</div></section>'+sections+'<section class="wiki-section" id="webhook-map"><div class="wiki-section-head"><span class="wiki-section-no">URL</span><div><h2>用户分流地址</h2><p class="wiki-section-intro">在系统配置 → 用户管理 → 工作流地址中填写对应 URL。复制内容会随上方域名输入实时更新。</p></div></div><table class="wiki-webhook-table"><thead><tr><th>平台</th><th>工作流</th><th>路径</th><th>完整地址</th><th></th></tr></thead><tbody>'+webhookRows+'</tbody></table><p class="wiki-footer-note">部署脚本下载与本页内容均由管理员 API 二次鉴权返回，浏览器静态文件不包含脚本、凭证 ID 或部署正文。</p></section></div></div>';bindWikiControls();updateDynamicContent()}
function updateDynamicContent(){if(!wikiData)return;var domain=normalizeDomain(wikiState.domain),warning='';if(!domain)warning='请输入有效的公开域名，例如 n8n-node2.example.com。';else if(!validNodeName(wikiState.nodeName))warning='节点名称仅允许小写字母、数字和连字符，最长 32 位。';else if(!validPort(wikiState.port))warning='本机端口必须为 1024-65535。';document.getElementById('wikiValidation').textContent=warning;document.querySelectorAll('[id^="command-"],[id^="webhook-"]').forEach(function(node){if(commandTemplates[node.id])node.textContent=resolveTemplate(commandTemplates[node.id])});var download=document.getElementById('downloadScript');download.disabled=!!warning}
function bindWikiControls(){['wikiDomain','wikiNodeName','wikiPort'].forEach(function(id){document.getElementById(id).addEventListener('input',function(event){if(id==='wikiDomain')wikiState.domain=event.target.value;else if(id==='wikiNodeName')wikiState.nodeName=event.target.value;else wikiState.port=event.target.value;updateDynamicContent()})});document.querySelectorAll('[data-copy]').forEach(function(button){button.addEventListener('click',function(){copyCommand(button.dataset.copy)})});document.getElementById('downloadScript').addEventListener('click',downloadScript)}
async function copyCommand(id){var value=resolveTemplate(commandTemplates[id]);try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(value);else{var area=document.createElement('textarea');area.value=value;area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();document.execCommand('copy');area.remove()}showWikiToast('命令已复制')}catch(_){showWikiToast('复制失败，请手动选择命令文本')}}
async function downloadScript(){var button=document.getElementById('downloadScript');button.disabled=true;button.textContent='下载中...';try{var result=await API.downloadDistributedN8nScript();if(!result.success)throw new Error(result.error||'脚本下载失败');var objectUrl=URL.createObjectURL(result.blob),link=document.createElement('a');link.href=objectUrl;link.download=result.filename;document.body.appendChild(link);link.click();link.remove();setTimeout(function(){URL.revokeObjectURL(objectUrl)},1000);showWikiToast('部署脚本已下载')}catch(error){showWikiToast(error.message||'脚本下载失败')}finally{button.textContent='下载部署脚本';updateDynamicContent()}}
async function loadWiki(){if(!await requireAuth())return;if(localStorage.getItem('ews_role')!=='admin'){location.replace('/');return}refreshNavCredits();var result=await API.getDistributedN8nWiki();if(!result.success||!result.wiki){document.getElementById('wikiMount').innerHTML='<div class="wiki-error">'+escapeHtml(result.error||'部署资料加载失败，请重新登录后再试。')+'</div>';return}renderWiki(result.wiki)}
document.addEventListener('DOMContentLoaded',loadWiki);
</script></body></html>
