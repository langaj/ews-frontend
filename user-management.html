<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>用户管理 - EWS</title>
<link rel="stylesheet" href="/css/style.css">
<style>
.user-page{max-width:1380px}.account-chip{display:inline-flex;align-items:center;min-height:30px;padding:5px 10px;border:1px solid var(--gray-200);border-radius:7px;background:#fff;color:var(--gray-600);font-size:12px}.user-page .card{box-shadow:none}.user-add-row{display:grid;grid-template-columns:1.1fr 1.3fr .9fr 1fr 1fr .8fr auto auto;gap:8px}.user-add-row .form-input{min-width:0;max-width:none!important}.user-list-toolbar{display:grid;grid-template-columns:minmax(220px,320px);margin-bottom:14px}.user-list-toolbar .form-label{margin-bottom:6px}.user-table table{min-width:1240px}.user-credits-cell,.user-concurrency-cell,.user-actions{display:flex;gap:5px;align-items:center;flex-wrap:wrap}.scope-note{margin-bottom:16px;padding:10px 12px;border-left:3px solid var(--primary);background:var(--gray-50);color:var(--gray-600);font-size:12px}.webhook-toolbar{display:grid;grid-template-columns:minmax(240px,420px);margin-bottom:16px}.workflow-override{max-width:180px}.webhook-panel{display:none}.webhook-panel.active{display:block}.webhook-form{max-width:920px}.webhook-form .form-row{align-items:end}.confirm-panel{text-align:left;padding:28px}.confirm-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:22px}.role-label{font-size:12px;font-weight:650}.role-label.restricted{color:var(--primary)}
@media(max-width:980px){.user-add-row{grid-template-columns:repeat(2,minmax(0,1fr))}.user-add-row .btn{width:100%}}
@media(max-width:680px){.user-add-row,.user-list-toolbar{grid-template-columns:1fr}.webhook-toolbar{grid-template-columns:1fr}.webhook-form .form-row{display:block}.user-table{overflow:auto}.tab-bar .tab-btn{min-width:max-content}.account-chip{max-width:100%;overflow-wrap:anywhere}}
</style>
</head><body>
<script src="/js/nav.js"></script>
<div class="app-container user-page">
  <div class="page-header"><div class="page-heading"><div class="page-kicker">管理中心</div><h1 class="page-title">用户管理</h1><p class="page-subtitle">维护账号、平台能力、算力、图片并发和用户 Webhook。</p></div><div class="account-chip" id="userInfo"></div></div>
  <div class="tab-bar" id="userTabs">
    <button class="tab-btn active" type="button" onclick="switchUserTab('accounts')">账号与权限</button>
    <button class="tab-btn" type="button" onclick="switchUserTab('webhooks')">用户 Webhook 配置</button>
  </div>

  <div class="tab-panel active" id="tab-accounts">
    <div class="card"><div class="card-header">添加用户</div><div class="card-body">
      <div class="scope-note" id="scopeNote"></div>
      <div class="user-add-row">
        <input type="text" class="form-input" id="newUsername" placeholder="用户名（英文/数字，最多16位）" maxlength="16" pattern="[A-Za-z0-9]{1,16}" title="仅允许1~16位英文字母或数字">
        <input type="password" class="form-input" id="addUserPassword" placeholder="密码（6~32位）" minlength="6" maxlength="32" pattern="[A-Za-z0-9._@\-]{6,32}" title="6~32位，仅允许英文字母、数字及 . _ @ -">
        <select class="form-input" id="newRole"><option value="user">普通用户</option><option value="group_admin">分组管理员</option></select>
        <select class="form-input" id="newPlatformAccess"><option value="allow">全部平台</option><option value="jst">仅聚水潭</option><option value="shopee">仅虾皮</option></select>
        <select class="form-input" id="newGroupId" title="所属分组"><option value="default">默认分组</option></select>
        <input type="number" class="form-input" id="newImageConcurrency" value="20" min="1" max="20" title="图片并发上限" placeholder="图片并发">
        <button class="btn btn-primary" type="button" onclick="runUserAction('add-user',this,'添加中...',handleAddUser)">添加用户</button>
        <button class="btn btn-outline" type="button" onclick="runUserAction('load-users',this,'刷新中...',loadUserList)">刷新列表</button>
      </div>
    </div></div>
    <div class="card" style="margin-top:20px"><div class="card-header">用户列表</div><div class="card-body">
      <div class="user-list-toolbar"><label class="form-label" for="userGroupFilter">按分组筛选</label><select class="form-input" id="userGroupFilter" onchange="renderUsers()"><option value="">全部分组</option></select></div>
      <div class="table-container user-table"><table><thead><tr><th>用户名</th><th>角色</th><th>状态</th><th>分组</th><th>平台能力</th><th>图片并发</th><th>算力</th><th>操作</th></tr></thead><tbody id="userListBody"><tr><td colspan="8" class="muted">正在加载...</td></tr></tbody></table></div>
    </div></div>
  </div>

  <div class="tab-panel" id="tab-webhooks">
    <div class="card"><div class="card-header">用户 Webhook 配置</div><div class="card-body">
      <div class="webhook-toolbar"><select class="form-input" id="webhookUserSelect" onchange="loadUserWebhook()"><option value="">请选择用户</option></select></div>
      <div id="userWebhookFields" style="display:none">
        <div class="tab-bar" id="webhookTabs">
          <button class="tab-btn active" id="webhookTabJst" type="button" onclick="switchWebhookTab('jst')">聚水潭</button>
          <button class="tab-btn" id="webhookTabShopee" type="button" onclick="switchWebhookTab('shopee')">Shopee</button>
        </div>
        <div class="webhook-panel active" id="webhook-jst"><div class="webhook-form">
          <div class="form-row"><div class="form-group"><label class="form-label">商品元数据</label><input type="url" class="form-input" id="uwh_jst_title" placeholder="留空则使用全局"></div><div class="form-group"><label class="form-label">商品元数据开关</label><select class="form-input workflow-override" id="uwh_jst_title_enabled"><option value="inherit">继承全局</option><option value="true">单独开启</option><option value="false">单独关闭</option></select></div></div>
          <div class="form-group"><label class="form-label">主图</label><input type="url" class="form-input" id="uwh_jst_main"></div><div class="form-group"><label class="form-label">附图</label><input type="url" class="form-input" id="uwh_jst_sub"></div><div class="form-group"><label class="form-label">详情图</label><input type="url" class="form-input" id="uwh_jst_detail"></div>
          <div class="form-row"><div class="form-group"><label class="form-label">SKU 图</label><input type="url" class="form-input" id="uwh_jst_sku"></div><div class="form-group"><label class="form-label">SKU 图片开关</label><select class="form-input workflow-override" id="uwh_jst_sku_enabled"><option value="inherit">继承全局</option><option value="true">单独开启</option><option value="false">单独关闭</option></select></div></div>
        </div></div>
        <div class="webhook-panel" id="webhook-shopee"><div class="webhook-form">
          <div class="form-row"><div class="form-group"><label class="form-label">商品元数据</label><input type="url" class="form-input" id="uwh_shopee_title" placeholder="留空则使用全局"></div><div class="form-group"><label class="form-label">商品元数据开关</label><select class="form-input workflow-override" id="uwh_shopee_title_enabled"><option value="inherit">继承全局</option><option value="true">单独开启</option><option value="false">单独关闭</option></select></div></div>
          <div class="form-group"><label class="form-label">主图</label><input type="url" class="form-input" id="uwh_shopee_main"></div><div class="form-group"><label class="form-label">附图</label><input type="url" class="form-input" id="uwh_shopee_sub"></div>
          <div class="form-row"><div class="form-group"><label class="form-label">SKU 图</label><input type="url" class="form-input" id="uwh_shopee_sku"></div><div class="form-group"><label class="form-label">SKU 图片开关</label><select class="form-input workflow-override" id="uwh_shopee_sku_enabled"><option value="inherit">继承全局</option><option value="true">单独开启</option><option value="false">单独关闭</option></select></div></div>
        </div></div>
        <button class="btn btn-primary" type="button" onclick="runUserAction('save-user-webhook',this,'保存中...',saveUserWebhook)">保存该用户配置</button>
      </div>
    </div></div>
  </div>
</div>

<div class="modal-overlay" id="confirmModal" style="z-index:300"><div class="modal" style="max-width:400px"><div class="modal-body confirm-panel"><div id="confirmMsg" style="font-size:16px;color:var(--gray-700);margin-bottom:24px"></div><div class="confirm-actions"><button class="btn btn-primary" type="button" onclick="resolveConfirm(true)">确定</button><button class="btn btn-outline" type="button" onclick="resolveConfirm(false)">取消</button></div></div></div></div>

<script src="/js/api.js?v=20260805-1"></script>
<script>
var users=[];var groups=[];var management={system_admin:false,group_id:'',platforms:[]};var userActionLocks={};var confirmResolve=null;
function escapeHtml(value){return String(value===undefined||value===null?'':value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function g(id){return document.getElementById(id).value.trim()}
function s(id,value){document.getElementById(id).value=value||''}
function isValidNewUsername(value){return /^[A-Za-z0-9]{1,16}$/.test(value)}
function isValidNewPassword(value){return /^[A-Za-z0-9._@-]{6,32}$/.test(value)}
function setWorkflowOverride(id,value){s(id,value===true||value==='true'?'true':value===false||value==='false'?'false':'inherit')}
function addWorkflowOverride(target,key,id){var value=g(id);if(value!=='inherit')target[key]=value==='true'}
function roleLabel(role){return role==='admin'?'默认管理员':role==='group_admin'?'分组管理员':'普通用户'}
async function runUserAction(key,control,label,action){if(userActionLocks[key])return;userActionLocks[key]=true;var original=control?control.textContent:'';if(control){control.disabled=true;control.textContent=label;control.classList.add('is-loading')}try{await action()}catch(error){showToast(error.message||'操作失败','error')}finally{delete userActionLocks[key];if(control){control.disabled=false;control.textContent=original;control.classList.remove('is-loading')}}}
function showConfirm(message){return new Promise(function(resolve){confirmResolve=resolve;document.getElementById('confirmMsg').textContent=message;document.getElementById('confirmModal').classList.add('show')})}
function resolveConfirm(result){document.getElementById('confirmModal').classList.remove('show');if(confirmResolve){confirmResolve(result);confirmResolve=null}}
function switchUserTab(name){document.querySelectorAll('#userTabs .tab-btn').forEach(function(button){button.classList.toggle('active',button.getAttribute('onclick').includes("'"+name+"'"))});document.querySelectorAll('.user-page>.tab-panel').forEach(function(panel){panel.classList.toggle('active',panel.id==='tab-'+name)});if(name==='webhooks')syncWebhookUserSelect()}
function switchWebhookTab(platform){document.querySelectorAll('#webhookTabs .tab-btn').forEach(function(button){button.classList.toggle('active',button.id==='webhookTab'+(platform==='jst'?'Jst':'Shopee'))});document.querySelectorAll('.webhook-panel').forEach(function(panel){panel.classList.toggle('active',panel.id==='webhook-'+platform)})}

document.addEventListener('DOMContentLoaded',async function(){if(!await requireAuth())return;var role=localStorage.getItem('ews_role')||'';if(role!=='admin'&&role!=='group_admin'){showToast('无权访问用户管理','error');setTimeout(function(){location.href='/'},600);return}document.getElementById('userInfo').textContent=(localStorage.getItem('ews_username')||'')+' · '+roleLabel(role)+(localStorage.getItem('ews_group_name')?' · '+localStorage.getItem('ews_group_name'):'');refreshNavCredits();await loadUserList()});

function groupOptions(selectedId){return groups.map(function(group){return'<option value="'+escapeHtml(group.id)+'" '+(group.id===selectedId?'selected':'')+'>'+escapeHtml(group.name)+(group.status==='disabled'?'（已停用）':'')+'</option>'}).join('')}
function platformOptions(selected){var allowed=management.platforms||[];var options=[];if(management.system_admin||allowed.length===2)options.push(['allow','全部平台']);if(allowed.includes('jst'))options.push(['jst','仅聚水潭']);if(allowed.includes('shopee'))options.push(['shopee','仅虾皮']);if(selected&&!options.some(function(option){return option[0]===selected})){var labels={allow:'全部平台',jst:'仅聚水潭',shopee:'仅虾皮'};options.unshift([selected,(labels[selected]||selected)+'（超出当前权限）',true])}return options.map(function(option){return'<option value="'+option[0]+'" '+(option[0]===selected?'selected ':'')+(option[2]?'disabled ':'')+'>'+option[1]+'</option>'}).join('')}
function applyManagementScope(){var roleSelect=document.getElementById('newRole');var groupSelect=document.getElementById('newGroupId');var filter=document.getElementById('userGroupFilter');var currentFilter=filter.value;roleSelect.querySelector('option[value="group_admin"]').disabled=!management.system_admin;groupSelect.innerHTML=groupOptions(management.group_id||groups[0]?.id||'');groupSelect.disabled=!management.system_admin;filter.innerHTML=(management.system_admin?'<option value="">全部分组</option>':'')+groupOptions(management.system_admin?currentFilter:(management.group_id||groups[0]?.id||''));filter.disabled=!management.system_admin;if(management.system_admin&&currentFilter&&groups.some(function(group){return group.id===currentFilter}))filter.value=currentFilter;document.getElementById('newPlatformAccess').innerHTML=platformOptions(management.platforms.length===1?management.platforms[0]:'allow');document.getElementById('scopeNote').textContent=management.system_admin?'默认管理员可维护所有分组用户，并可创建分组管理员。':'当前仅可管理“'+(groups[0]?.name||localStorage.getItem('ews_group_name')||'所属分组')+'”内用户，且新用户平台能力不能超过当前账号。'}
async function loadUserList(){var results=await Promise.all([API.getUsers(),API.getGroups()]);if(!results[0].success||!results[1].success)throw new Error(results[0].error||results[1].error||'用户列表加载失败');users=results[0].users||[];management=results[0].management||management;groups=results[1].groups||[];applyManagementScope();renderUsers();syncWebhookUserSelect()}
function renderUsers(){var body=document.getElementById('userListBody');var groupId=g('userGroupFilter');var visibleUsers=groupId?users.filter(function(user){return user.group_id===groupId}):users;if(!visibleUsers.length){body.innerHTML='<tr><td colspan="8" class="muted">'+(groupId?'所选分组暂无用户':'当前范围内暂无用户')+'</td></tr>';return}body.innerHTML=visibleUsers.map(function(user){var key=encodeURIComponent(user.id);var systemUser=user.id==='admin';var status=!user.is_active?'<span style="color:var(--danger)">已禁用</span>':(!user.login_enabled&&user.role!=='admin'?'<span style="color:var(--danger)">分组停用</span>':'<span style="color:var(--success)">活跃</span>');var groupHtml=management.system_admin?'<select class="form-input" onchange="updateUserGroup(decodeURIComponent(\''+key+'\'),this)" style="width:130px;font-size:12px;padding:2px 6px">'+groupOptions(user.group_id)+'</select>':'<span>'+escapeHtml(user.group_name||'-')+'</span>';var access=systemUser?'<span class="muted">全部平台</span>':'<select class="form-input" id="pa_'+key+'" onchange="updatePlatformAccess(decodeURIComponent(\''+key+'\'))" style="width:110px;font-size:12px;padding:2px 6px">'+platformOptions(user.platform_access)+'</select>';var concurrency='<div class="user-concurrency-cell"><input type="number" class="form-input" id="ic_'+key+'" value="'+Number(user.image_concurrency_limit||20)+'" min="1" max="20" style="width:64px;font-size:12px;padding:2px 6px"><button class="btn btn-sm btn-outline" type="button" onclick="updateImageConcurrency(decodeURIComponent(\''+key+'\'),this)">保存</button></div>';var credits='<div class="user-credits-cell"><strong>'+Number(user.credits||0)+'</strong><input type="number" class="form-input" id="ci_'+key+'" value="0" min="0" style="width:60px;font-size:12px;padding:2px 6px"><select class="form-input" id="ca_'+key+'" style="width:70px;font-size:12px;padding:2px 6px"><option value="add">增加</option><option value="subtract">减少</option><option value="set">设置</option></select><button class="btn btn-sm btn-outline" type="button" onclick="updateCredits(decodeURIComponent(\''+key+'\'))">确认</button></div>';var actions=systemUser?'-':'<div class="user-actions"><button class="btn btn-sm btn-outline" type="button" onclick="toggleUser(decodeURIComponent(\''+key+'\'))">'+(user.is_active?'禁用':'启用')+'</button><button class="btn btn-sm btn-outline" type="button" onclick="resetUserPwd(decodeURIComponent(\''+key+'\'))">重置密码</button><button class="btn btn-sm btn-danger" type="button" onclick="deleteUserConfirm(decodeURIComponent(\''+key+'\'))">删除</button></div>';return'<tr><td>'+escapeHtml(user.username)+'</td><td><span class="role-label '+(user.role==='group_admin'?'restricted':'')+'">'+roleLabel(user.role)+'</span></td><td>'+status+'</td><td>'+groupHtml+'</td><td>'+access+'</td><td>'+concurrency+'</td><td>'+credits+'</td><td>'+actions+'</td></tr>'}).join('')}
function syncWebhookUserSelect(){var select=document.getElementById('webhookUserSelect');var current=select.value;select.innerHTML='<option value="">请选择用户</option>'+users.map(function(user){return'<option value="'+escapeHtml(user.id)+'">'+escapeHtml(user.username)+' · '+roleLabel(user.role)+'</option>'}).join('');if(users.some(function(user){return user.id===current}))select.value=current}
async function handleAddUser(){var username=g('newUsername');var password=document.getElementById('addUserPassword').value;var role=g('newRole');var access=g('newPlatformAccess');var groupId=g('newGroupId');var concurrency=parseInt(g('newImageConcurrency'));if(!isValidNewUsername(username))throw new Error('用户名仅允许1~16位英文字母或数字');if(!isValidNewPassword(password))throw new Error('密码必须为6~32位，仅允许英文字母、数字及 . _ @ -');if(!Number.isInteger(concurrency)||concurrency<1||concurrency>20)throw new Error('图片并发必须为1~20');var result=await API.createUser(username,password,role,access,concurrency,groupId);if(!result.success)throw new Error(result.error||'创建失败');s('newUsername','');s('addUserPassword','');showToast(result.message||'用户创建成功','success');await loadUserList()}
async function updatePlatformAccess(userId){var result=await API.updateUserPlatform(userId,g('pa_'+encodeURIComponent(userId)));if(!result.success){showToast(result.error||'平台权限更新失败','error');await loadUserList()}else showToast(result.message,'success')}
async function updateUserGroup(userId,select){select.disabled=true;try{var result=await API.updateUserGroup(userId,select.value);if(!result.success)throw new Error(result.error||'分组更新失败');showToast(result.message,'success')}catch(error){showToast(error.message,'error')}finally{select.disabled=false;await loadUserList()}}
async function updateImageConcurrency(userId,button){await runUserAction('concurrency:'+userId,button,'保存中...',async function(){var limit=parseInt(g('ic_'+encodeURIComponent(userId)));if(!Number.isInteger(limit)||limit<1||limit>20)throw new Error('图片并发必须为1~20');var result=await API.updateUserConcurrency(userId,limit);if(!result.success)throw new Error(result.error||'更新失败');showToast(result.message,'success')})}
async function updateCredits(userId){var key=encodeURIComponent(userId);var amount=parseInt(g('ci_'+key));if(!Number.isInteger(amount)||amount<0){showToast('请输入有效数值','error');return}var result=await API.updateUserCredits(userId,g('ca_'+key),amount);if(!result.success)showToast(result.error||'算力更新失败','error');else{showToast(result.message,'success');await loadUserList();refreshNavCredits()}}
async function toggleUser(userId){var result=await API.toggleUser(userId);if(!result.success)showToast(result.error||'操作失败','error');else{showToast(result.message,'success');await loadUserList()}}
async function resetUserPwd(userId){if(!await showConfirm('确定要将该用户的密码重置为 user123 吗？'))return;var result=await API.resetPassword(userId);showToast(result.success?result.message:(result.error||'重置失败'),result.success?'success':'error')}
async function deleteUserConfirm(userId){var user=users.find(function(item){return item.id===userId});if(!user||!await showConfirm('确定要删除用户 '+user.username+' 吗？该操作不可撤销。'))return;var result=await API.deleteUser(userId);if(!result.success)showToast(result.error||'删除失败','error');else{showToast(result.message,'success');await loadUserList()}}
function resetWebhookFields(){['jst_title','jst_main','jst_sub','jst_detail','jst_sku','shopee_title','shopee_main','shopee_sub','shopee_sku'].forEach(function(key){s('uwh_'+key,'')});['jst_title_enabled','jst_sku_enabled','shopee_title_enabled','shopee_sku_enabled'].forEach(function(key){s('uwh_'+key,'inherit')})}
function applyWebhookPlatforms(platforms){['jst','shopee'].forEach(function(platform){var allowed=platforms.includes(platform);document.getElementById('webhookTab'+(platform==='jst'?'Jst':'Shopee')).style.display=allowed?'':'none'});switchWebhookTab(platforms[0]||'jst')}
async function loadUserWebhook(){var userId=g('webhookUserSelect');var fields=document.getElementById('userWebhookFields');if(!userId){fields.style.display='none';return}resetWebhookFields();var result=await API.getUserWebhook(userId);if(!result.success){fields.style.display='none';showToast(result.error||'Webhook 配置加载失败','error');return}fields.style.display='block';applyWebhookPlatforms(result.platforms||management.platforms||[]);var jst=result.webhook?.jst||{};var shopee=result.webhook?.shopee||{};s('uwh_jst_title',jst.n8n_title_webhook);setWorkflowOverride('uwh_jst_title_enabled',jst.n8n_title_enabled);s('uwh_jst_main',jst.n8n_main_webhook);s('uwh_jst_sub',jst.n8n_sub_image_webhook);s('uwh_jst_detail',jst.n8n_detail_webhook);s('uwh_jst_sku',jst.n8n_sku_image_webhook);setWorkflowOverride('uwh_jst_sku_enabled',jst.n8n_sku_image_enabled);s('uwh_shopee_title',shopee.n8n_title_webhook);setWorkflowOverride('uwh_shopee_title_enabled',shopee.n8n_title_enabled);s('uwh_shopee_main',shopee.n8n_main_webhook);s('uwh_shopee_sub',shopee.n8n_sub_image_webhook);s('uwh_shopee_sku',shopee.n8n_sku_image_webhook);setWorkflowOverride('uwh_shopee_sku_enabled',shopee.n8n_sku_image_enabled)}
async function saveUserWebhook(){var userId=g('webhookUserSelect');if(!userId)throw new Error('请选择用户');var config={jst:{n8n_title_webhook:g('uwh_jst_title'),n8n_main_webhook:g('uwh_jst_main'),n8n_sub_image_webhook:g('uwh_jst_sub'),n8n_detail_webhook:g('uwh_jst_detail'),n8n_sku_image_webhook:g('uwh_jst_sku')},shopee:{n8n_title_webhook:g('uwh_shopee_title'),n8n_main_webhook:g('uwh_shopee_main'),n8n_sub_image_webhook:g('uwh_shopee_sub'),n8n_sku_image_webhook:g('uwh_shopee_sku')}};addWorkflowOverride(config.jst,'n8n_title_enabled','uwh_jst_title_enabled');addWorkflowOverride(config.jst,'n8n_sku_image_enabled','uwh_jst_sku_enabled');addWorkflowOverride(config.shopee,'n8n_title_enabled','uwh_shopee_title_enabled');addWorkflowOverride(config.shopee,'n8n_sku_image_enabled','uwh_shopee_sku_enabled');var result=await API.updateUserWebhook(userId,config);if(!result.success)throw new Error(result.error||'保存失败');showToast(result.message||'已保存','success')}
</script>
